name: Build APK (marcado como jogo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Marcar o app como jogo no AndroidManifest
        run: |
          set -euo pipefail
          MANIFEST="app/src/main/AndroidManifest.xml"

          if ! grep -q 'android:appCategory=' "$MANIFEST"; then
            sed -i '0,/<application/s//<application\n        android:appCategory="game"/' "$MANIFEST"
          fi
          if ! grep -q 'android:isGame=' "$MANIFEST"; then
            sed -i '0,/<application/s//<application\n        android:isGame="true"/' "$MANIFEST"
          fi

          grep -q 'android:appCategory="game"' "$MANIFEST"
          grep -q 'android:isGame="true"' "$MANIFEST"
          python3 -c "import xml.dom.minidom as m; m.parse('$MANIFEST')"
          grep -n -A4 '<application' "$MANIFEST"

      - name: Preparar google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
            exit 0
          fi
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Aceitar licenças e instalar build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-game"

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Chave da CurseForge (opcional)
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY:-}" >> local.properties

      - name: Desativar upload de símbolos do Crashlytics
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-crashlytics-upload.gradle <<'GRADLE'
          allprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith("uploadCrashlytics")) {
                      t.enabled = false
                  }
              }
          }
          GRADLE

      - name: Build APK debug (assinado com a chave debug)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Conferir que o APK final está marcado como jogo
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest-dump.txt
          grep -q 'appCategory' manifest-dump.txt
          grep -q 'isGame' manifest-dump.txt
          echo "OK: appCategory e isGame presentes em $APK"
          cp "$APK" LeviLauncher-game-debug.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-game-debug-apk
          path: LeviLauncher-game-debug.apk
          if-no-files-found: error
